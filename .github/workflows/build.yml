name: PyInstaller testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: PyInstaller kur
        run: python -m pip install "pyinstaller==6.7.0"

      - name: PyInstaller sürümünü göster
        run: python -m PyInstaller --version
