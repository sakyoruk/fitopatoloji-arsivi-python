name: Fitopatoloji Arsivi derle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Kaynak dosyalari al
        uses: actions/checkout@v4

      - name: Python 3.8 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Bagimliliklari kur
        run: python -m pip install --upgrade pip pyinstaller pillow "reportlab==3.6.13"

      - name: Uygulamayi test et
        run: python app.py --self-test

      - name: EXE olustur
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name FitopatolojiArsivi
          --hidden-import=PIL._tkinter_finder
          --collect-all reportlab
          --add-data "seed;seed"
          app.py

      - name: Kullanma dosyasini kopyala
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paket | Out-Null
          Copy-Item dist\FitopatolojiArsivi.exe paket\
          if (Test-Path README.md) { Copy-Item README.md paket\ }

      - name: Indirilebilir paket olustur
        uses: actions/upload-artifact@v4
        with:
          name: FitopatolojiArsivi-Windows
          path: paket
