name: Fitopatoloji Arsivi derle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Kaynak dosyalari al
        uses: actions/checkout@v4

      - name: Python 3.8 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: PyInstaller kur
        run: python -m pip install "pyinstaller==6.7.0"

      - name: Uygulamayi test et
        run: python app.py --self-test

      - name: EXE olustur
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name FitopatolojiArsivi
          --add-data "seed/diseases.csv;seed"
          app.py

      - name: Kullanma dosyasini kopyala
        shell: powershell
        run: |
          Copy-Item "KULLANIM.txt" "dist\FitopatolojiArsivi\KULLANIM.txt"

      - name: Indirilebilir paket olustur
        uses: actions/upload-artifact@v4
        with:
          name: FitopatolojiArsivi-Windows
          path: dist/FitopatolojiArsivi
          retention-days: 30
